# Spring Boot Configuration
# Lab: Modular Monolith Integration with a React Frontend
# Student Package: edu.cit.patonog
# =============================================================================

spring.application.name=modular-shop-app
server.port=${SERVER_PORT:8080}

# Supabase PostgreSQL Datasource Configuration
# Environment variables take precedence, keeping credentials out of Git
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
